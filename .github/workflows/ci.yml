name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The tests pin their own throwaway SQLite DB and blank out SMTP/Razorpay
      # settings (see tests/conftest.py), so no secrets are needed here.
      - name: Run tests
        run: pytest

      # Migrations must apply cleanly to an empty DB, and the models must not
      # have drifted from them (a model change without a migration fails here).
      - name: Apply migrations to a fresh database
        env:
          DATABASE_URL: sqlite:///ci_migrations.db
        run: alembic upgrade head

      - name: Check models match migrations
        env:
          DATABASE_URL: sqlite:///ci_migrations.db
        run: alembic check

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # A production build needs a real, public API address (it refuses localhost or none).
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.example.com/api
        run: npm run build

      # Regression check for that guard: a build with no address, or a local one, must FAIL.
      - name: Production build refuses a missing or local API address
        run: |
          if VITE_API_BASE_URL= npm run build; then echo "build should have failed with no API address"; exit 1; fi
          if VITE_API_BASE_URL=http://localhost:8000/api npm run build; then echo "build should have failed with a localhost API address"; exit 1; fi
          echo "guard works"

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Starts its own API (throwaway SQLite database, no email, no payments) and site, then
      # drives a real browser through sign-up, login, the student journey and the admin portal.
      - name: Run browser smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
