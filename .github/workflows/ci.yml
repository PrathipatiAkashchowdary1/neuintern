name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The tests pin their own throwaway SQLite DB and blank out SMTP/Razorpay
      # settings (see tests/conftest.py), so no secrets are needed here.
      - name: Run tests
        run: pytest

      # Migrations must apply cleanly to an empty DB, and the models must not
      # have drifted from them (a model change without a migration fails here).
      - name: Apply migrations to a fresh database
        env:
          DATABASE_URL: sqlite:///ci_migrations.db
        run: alembic upgrade head

      - name: Check models match migrations
        env:
          DATABASE_URL: sqlite:///ci_migrations.db
        run: alembic check

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
